<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Walkthrough</title>
    <meta
      name="description"
      content="Step inside a codebase. A software project becomes a little city on your desk: pinch a building to walk in and ask the robots who run it how it works. Hands only, in VR."
    />
    <meta property="og:title" content="Walkthrough" />
    <meta
      property="og:description"
      content="A software project becomes a little city on your desk. Pinch a building, step inside, and ask the robots who run it how it works."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1117;
        color: #f0f3f6;
        font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      #scene-container {
        position: fixed;
        inset: 0;
      }
      #landing {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        pointer-events: none;
        transition: background 0.5s ease;
      }
      #landing[hidden] {
        display: none;
      }
      #landing.loading {
        justify-content: center;
        background: radial-gradient(120% 90% at 50% 40%, #16202e 0%, #0d1117 70%);
        pointer-events: auto;
      }
      .brand {
        display: none;
        text-align: center;
        padding: 0 24px;
      }
      .loading .brand {
        display: block;
      }
      .brand h1 {
        margin: 0 0 10px;
        font-size: clamp(30px, 6vw, 52px);
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .brand p {
        margin: 0 auto;
        max-width: 34em;
        font-size: clamp(15px, 2.2vw, 19px);
        line-height: 1.5;
        color: #aab4c0;
      }
      .bar {
        margin: 26px auto 0;
        width: min(260px, 60vw);
        height: 4px;
        border-radius: 2px;
        background: #222c3a;
        overflow: hidden;
      }
      .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #7ee0c9;
        animation: slide 1.2s ease-in-out infinite alternate;
      }
      @keyframes slide {
        from {
          transform: translateX(-30%);
        }
        to {
          transform: translateX(180%);
        }
      }
      .dock {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin: 0 16px 28px;
        padding: 18px 22px 16px;
        max-width: 620px;
        border-radius: 22px;
        background: rgba(13, 17, 23, 0.86);
        border: 1px solid rgba(126, 224, 201, 0.35);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        pointer-events: auto;
        text-align: center;
      }
      .ready .dock {
        display: flex;
      }
      .dock .row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }
      .dock button {
        font: inherit;
        font-weight: 700;
        border: 0;
        border-radius: 999px;
        cursor: pointer;
        /* Large targets: these are pressed with a hand pinch in the headset's browser. */
        min-height: 64px;
        padding: 0 34px;
        font-size: 22px;
      }
      #enter-vr {
        background: #7ee0c9;
        color: #06241d;
      }
      #enter-vr:hover,
      #enter-vr:focus-visible {
        background: #a5f0de;
      }
      #enter-mr {
        background: #f0f3f6;
        color: #0b1118;
      }
      #enter-mr:hover,
      #enter-mr:focus-visible {
        background: #ffffff;
      }
      #allow-mic {
        background: #222c3a;
        color: #f0f3f6;
        font-size: 18px;
        font-weight: 600;
      }
      #allow-mic:hover,
      #allow-mic:focus-visible {
        background: #2d3a4c;
      }
      #allow-mic:disabled {
        cursor: default;
        color: #7ee0c9;
        background: transparent;
        border: 1px solid rgba(126, 224, 201, 0.4);
      }
      .dock button[hidden] {
        display: none;
      }
      #repo-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
        padding-top: 10px;
        border-top: 1px solid rgba(126, 224, 201, 0.2);
      }
      #repo-form[hidden] {
        display: none;
      }
      #repo-form label {
        font-size: 16px;
        font-weight: 600;
        color: #f0f3f6;
      }
      .repo-row {
        display: flex;
        gap: 8px;
      }
      #repo-input {
        flex: 1;
        min-width: 0;
        min-height: 52px;
        padding: 0 16px;
        font: inherit;
        font-size: 18px;
        color: #f0f3f6;
        background: #161d27;
        border: 1px solid rgba(126, 224, 201, 0.4);
        border-radius: 14px;
      }
      .dock #repo-go {
        min-height: 52px;
        padding: 0 22px;
        font-size: 18px;
        background: #7ee0c9;
        color: #06241d;
      }
      .dock #repo-go:disabled {
        opacity: 0.6;
        cursor: progress;
      }
      .repo-try {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        color: #aab4c0;
      }
      .dock .repo-try button {
        min-height: 40px;
        padding: 0 14px;
        font-size: 15px;
        font-weight: 600;
        background: #222c3a;
        color: #f0f3f6;
      }
      #repo-note {
        margin: 0;
        min-height: 1.4em;
        font-size: 15px;
        color: #aab4c0;
      }
      #repo-note.ok {
        color: #7ee0c9;
      }
      #repo-note.bad {
        color: #ff9b8f;
      }
      #workorder {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
        padding-top: 10px;
        border-top: 1px solid rgba(126, 224, 201, 0.2);
        text-align: left;
      }
      #workorder[hidden] {
        display: none;
      }
      #workorder-title {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        color: #f0f3f6;
        text-align: center;
      }
      #workorder-list {
        margin: 0;
        padding-left: 22px;
        font-size: 14px;
        line-height: 1.4;
        color: #c9d1d9;
        max-height: 170px;
        overflow-y: auto;
      }
      #workorder-list .more {
        list-style: none;
        margin-left: -22px;
        color: #8b949e;
      }
      .workorder-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }
      .dock #workorder-copy,
      #workorder-issue {
        display: inline-flex;
        align-items: center;
        min-height: 52px;
        padding: 0 22px;
        border-radius: 999px;
        font-size: 17px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      #workorder-issue {
        background: #7ee0c9;
        color: #06241d;
      }
      #workorder-issue[hidden] {
        display: none;
      }
      .dock #workorder-copy {
        background: #222c3a;
        color: #f0f3f6;
      }
      #workorder-note {
        margin: 0;
        min-height: 1.2em;
        font-size: 14px;
        color: #7ee0c9;
        text-align: center;
      }
      #workorder-text {
        width: 100%;
        height: 110px;
        font: 13px/1.4 ui-monospace, Consolas, monospace;
        color: #f0f3f6;
        background: #161d27;
        border: 1px solid rgba(126, 224, 201, 0.4);
        border-radius: 10px;
      }
      #workorder-text[hidden] {
        display: none;
      }
      #landing-note {
        margin: 0;
        font-size: 15px;
        line-height: 1.45;
        color: #aab4c0;
      }
      #landing-more {
        margin: 0;
        font-size: 14px;
      }
      #landing-more a {
        color: #7ee0c9;
        text-underline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="landing" class="loading">
      <div class="brand">
        <h1>Walkthrough</h1>
        <p>
          A software project becomes a little city on your desk. Pinch a
          building, step inside, and ask the robots who run it how it works.
        </p>
        <div class="bar" role="progressbar" aria-label="Loading"></div>
      </div>
      <div class="dock">
        <div class="row">
          <button id="enter-vr" type="button" hidden>Enter VR</button>
          <button id="enter-mr" type="button" hidden>Mixed reality</button>
          <button id="allow-mic" type="button" hidden>Allow microphone</button>
        </div>
        <p id="landing-note"></p>
        <form id="repo-form" hidden>
          <label for="repo-input">Or step inside any public GitHub repository</label>
          <div class="repo-row">
            <input id="repo-input" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github.com/owner/repo" maxlength="200" />
            <button id="repo-go" type="submit">Build city</button>
          </div>
          <div class="repo-try">
            Try:
            <button type="button" data-repo="pallets/flask">Flask</button>
            <button type="button" data-repo="expressjs/express">Express</button>
            <button type="button" data-repo="vercel/swr">SWR</button>
          </div>
          <p id="repo-note" aria-live="polite"></p>
        </form>
        <div id="workorder" hidden>
          <p id="workorder-title"></p>
          <ol id="workorder-list"></ol>
          <div class="workorder-row">
            <a id="workorder-issue" target="_blank" rel="noopener" hidden>Open as a GitHub issue</a>
            <button id="workorder-copy" type="button">Copy for your coding agent</button>
          </div>
          <p id="workorder-note" aria-live="polite"></p>
          <textarea id="workorder-text" readonly hidden></textarea>
        </div>
        <p id="landing-more">
          <a href="https://github.com/calebluh/walkthrough" target="_blank" rel="noopener">Map your own code with the Claude Code plugin</a>
        </p>
      </div>
    </div>
    <noscript>Walkthrough needs JavaScript and a WebXR browser, such as the Meta Quest Browser.</noscript>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
