<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Codebase Diorama</title>
    <meta
      name="description"
      content="Step inside a codebase. A software project becomes a little city on your desk: pinch a building to walk in and ask the robots who run it how it works. Hands only, in VR."
    />
    <meta property="og:title" content="Codebase Diorama" />
    <meta
      property="og:description"
      content="A software project becomes a little city on your desk. Pinch a building, step inside, and ask the robots who run it how it works."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0d1117" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Crect x='5' y='15' width='7' height='11' rx='1.5' fill='%2358a6ff'/%3E%3Crect x='13' y='8' width='7' height='18' rx='1.5' fill='%237ee0c9'/%3E%3Crect x='21' y='12' width='6' height='14' rx='1.5' fill='%23f0a742'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1117;
        color: #f0f3f6;
        font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      #scene-container {
        position: fixed;
        inset: 0;
      }
      #landing {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        pointer-events: none;
        transition: background 0.5s ease;
      }
      #landing[hidden] {
        display: none;
      }
      #landing.loading {
        justify-content: center;
        background: radial-gradient(120% 90% at 50% 40%, #16202e 0%, #0d1117 70%);
        pointer-events: auto;
      }
      .brand {
        display: none;
        text-align: center;
        padding: 0 24px;
      }
      .loading .brand {
        display: block;
      }
      .brand h1 {
        margin: 0 0 10px;
        font-size: clamp(30px, 6vw, 52px);
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .brand p {
        margin: 0 auto;
        max-width: 34em;
        font-size: clamp(15px, 2.2vw, 19px);
        line-height: 1.5;
        color: #aab4c0;
      }
      .bar {
        margin: 26px auto 0;
        width: min(260px, 60vw);
        height: 4px;
        border-radius: 2px;
        background: #222c3a;
        overflow: hidden;
      }
      .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #7ee0c9;
        animation: slide 1.2s ease-in-out infinite alternate;
      }
      @keyframes slide {
        from {
          transform: translateX(-30%);
        }
        to {
          transform: translateX(180%);
        }
      }
      .dock {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin: 0 16px 28px;
        padding: 18px 22px 16px;
        max-width: 620px;
        border-radius: 22px;
        background: rgba(13, 17, 23, 0.86);
        border: 1px solid rgba(126, 224, 201, 0.35);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        pointer-events: auto;
        text-align: center;
      }
      .ready .dock {
        display: flex;
      }
      .dock .row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }
      .dock button {
        font: inherit;
        font-weight: 700;
        border: 0;
        border-radius: 999px;
        cursor: pointer;
        /* Large targets: these are pressed with a hand pinch in the headset's browser. */
        min-height: 64px;
        padding: 0 34px;
        font-size: 22px;
      }
      #enter-vr {
        background: #7ee0c9;
        color: #06241d;
      }
      #enter-vr:hover,
      #enter-vr:focus-visible {
        background: #a5f0de;
      }
      #allow-mic {
        background: #222c3a;
        color: #f0f3f6;
        font-size: 18px;
        font-weight: 600;
      }
      #allow-mic:hover,
      #allow-mic:focus-visible {
        background: #2d3a4c;
      }
      #allow-mic:disabled {
        cursor: default;
        color: #7ee0c9;
        background: transparent;
        border: 1px solid rgba(126, 224, 201, 0.4);
      }
      .dock button[hidden] {
        display: none;
      }
      #landing-note {
        margin: 0;
        font-size: 15px;
        line-height: 1.45;
        color: #aab4c0;
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="landing" class="loading">
      <div class="brand">
        <h1>Codebase Diorama</h1>
        <p>
          A software project becomes a little city on your desk. Pinch a
          building, step inside, and ask the robots who run it how it works.
        </p>
        <div class="bar" role="progressbar" aria-label="Loading"></div>
      </div>
      <div class="dock">
        <div class="row">
          <button id="enter-vr" type="button" hidden>Enter VR</button>
          <button id="allow-mic" type="button" hidden>Allow microphone</button>
        </div>
        <p id="landing-note"></p>
      </div>
    </div>
    <noscript>Codebase Diorama needs JavaScript and a WebXR browser, such as the Meta Quest Browser.</noscript>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
